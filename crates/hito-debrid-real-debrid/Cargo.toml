[package]
name = "hito-debrid-real-debrid"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
test-support = ["hito-remote-audio/test-support"]

[dependencies]
hito-remote-audio = { path = "../hito-remote-audio" }
reqwest = { workspace = true, features = ["form"] }
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
zeroize.workspace = true

[dev-dependencies]
hito-remote-audio = { path = "../hito-remote-audio", features = ["test-support"] }
hito-audio = { path = "../hito-audio" }
hito-testkit = { path = "../hito-testkit" }
rcgen = { version = "=0.14.10", default-features = false, features = ["ring"] }
tokio-rustls = { version = "=0.26.6", default-features = false }
