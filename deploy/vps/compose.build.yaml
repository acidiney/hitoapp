name: hito-vps-build

services:
  server:
    image: hito-vps/server:${HITO_VPS_REVISION:?Set the full clean source commit}-amd64
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: Dockerfile
      target: runtime
      args:
        HITO_SERVER_CACHE_ID: hito-vps-${HITO_VPS_REVISION:?Set the full clean source commit}-amd64-server
      labels:
        org.opencontainers.image.revision: ${HITO_VPS_REVISION:?Set the full clean source commit}
        org.hito.deployment: hito-vps

  plugin-folder:
    image: hito-vps/plugin-folder:${HITO_VPS_REVISION:?Set the full clean source commit}-amd64
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: Dockerfile.plugin-folder
      args:
        HITO_PLUGIN_CACHE_ID: hito-vps-${HITO_VPS_REVISION:?Set the full clean source commit}-amd64-folder
      labels:
        org.opencontainers.image.revision: ${HITO_VPS_REVISION:?Set the full clean source commit}
        org.hito.deployment: hito-vps

  plugin-spotify:
    image: hito-vps/plugin-spotify:${HITO_VPS_REVISION:?Set the full clean source commit}-amd64
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: Dockerfile.plugin-spotify
      args:
        HITO_PLUGIN_CACHE_ID: hito-vps-${HITO_VPS_REVISION:?Set the full clean source commit}-amd64-spotify
      labels:
        org.opencontainers.image.revision: ${HITO_VPS_REVISION:?Set the full clean source commit}
        org.hito.deployment: hito-vps

  plugin-youtube:
    image: hito-vps/plugin-youtube:${HITO_VPS_REVISION:?Set the full clean source commit}-amd64
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: Dockerfile.plugin-youtube
      args:
        HITO_PLUGIN_CACHE_ID: hito-vps-${HITO_VPS_REVISION:?Set the full clean source commit}-amd64-youtube
      labels:
        org.opencontainers.image.revision: ${HITO_VPS_REVISION:?Set the full clean source commit}
        org.hito.deployment: hito-vps
