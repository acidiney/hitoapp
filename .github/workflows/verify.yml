name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: "4"
  COMPOSE_EXTRA: scripts/ci/sccache.compose.yaml
  COMPOSE_FILE: compose.yaml:scripts/ci/sccache.compose.yaml
jobs:
  desktop-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Verify Linux desktop in Docker
        run: ./scripts/check-desktop.sh
      - name: Upload desktop evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-evidence
          path: test-results/desktop/
          retention-days: 7
  rust-style:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Check formatting
        run: make fmt-check
      - name: Lint
        run: make lint
  rust-core:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Test core
        run: make check-core
  rust-server:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Test server
        run: make check-server
  rust-rest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Test the other crates
        run: make check-rest
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Install
        run: make web-install
      - name: Lint
        run: make web-lint
      - name: Test
        run: make test-web
      - name: Build
        run: make web-build
      - name: Audit
        run: make web-audit
      - name: Check contracts
        run: make contracts
      - name: Check setup
        run: make setup-check
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Install
        run: make web-install
      - name: Browser tests
        run: make e2e
      - name: Upload browser evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: |
            apps/web/test-results/
            test-results/
          retention-days: 7
