services:
  hardened:
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  private-service:
    extends:
      service: hardened
    user: "10001:10001"
    init: true
    cpus: "1.0"
    stop_signal: SIGTERM
    stop_grace_period: 30s
    restart: "no"
