services:
  plugin-spotify:
    extends:
      file: deploy/compose/plugin-base.yaml
      service: hardened
    profiles: [plugins]
    image: hito-plugin-spotify:latest
    build:
      context: .
      dockerfile: docker/plugin.Dockerfile
      args:
        PLUGIN: hito-plugin-spotify
        PORT: "8092"
        HITO_PLUGIN_CACHE_ID: hito-plugin-${COMPOSE_PROJECT_NAME:-standalone}
    command:
      - --listen
      - 0.0.0.0:8092
    ports:
      - "127.0.0.1:${HITO_SPOTIFY_PORT:-8092}:8092"
    environment:
      RUST_LOG: info
    restart: unless-stopped
