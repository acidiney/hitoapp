services:
  plugin-spotify:
    profiles: [plugins]
    image: hito-plugin-spotify:latest
    build:
      context: .
      dockerfile: docker/plugin.Dockerfile
      args:
        PLUGIN: hito-plugin-spotify
        PORT: "8092"
        HITO_PLUGIN_CACHE_ID: hito-plugin-${COMPOSE_PROJECT_NAME:-standalone}
    command:
      - --listen
      - 0.0.0.0:8092
    ports:
      - "127.0.0.1:${HITO_SPOTIFY_PORT:-8092}:8092"
    environment:
      RUST_LOG: info
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
