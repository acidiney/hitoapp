[package]
name = "hito-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
device = ["hito-playback/device"]
gui = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-build", "dep:souvlaki", "device"]

[dependencies]
hito-core = { path = "../../crates/core" }
hito-server = { path = "../server" }
hito-playback = { path = "../../crates/playback" }
axum.workspace = true
tokio.workspace = true
serde.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
url.workspace = true
futures-util.workspace = true
subtle = "2.6.1"
tauri = { version = "=2.12.4", optional = true }
souvlaki = { version = "=0.8.3", optional = true }
tauri-plugin-dialog = { version = "=2.8.4", optional = true, default-features = false, features = ["gtk3"] }

[build-dependencies]
tauri-build = { version = "2.7.2", optional = true }

[dev-dependencies]
hito-audio = { path = "../../crates/audio", features = ["test-support"] }
tempfile.workspace = true
reqwest.workspace = true
serde_json.workspace = true
sqlx.workspace = true

[[bin]]
name = "hito-desktop"
path = "src/main.rs"
required-features = ["gui"]
