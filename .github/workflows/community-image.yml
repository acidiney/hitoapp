name: Community image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - apps/community/**
      - crates/**
      - vendor/**
      - docker/community.Dockerfile
      - Cargo.lock
      - .github/workflows/community-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: community-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/hito-community
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=long
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/community.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=community-image
          cache-to: type=gha,scope=community-image,mode=max
