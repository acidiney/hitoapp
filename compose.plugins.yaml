services:
  plugin-folder:
    build:
      context: .
      dockerfile: Dockerfile.plugin-folder
    ports:
      - "127.0.0.1:8091:8090"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
