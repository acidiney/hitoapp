name: Scale
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: "4"
jobs:
  scale:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/compiler-cache
      - name: Scale checks
        run: make check-scale
