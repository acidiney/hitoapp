[package]
name = "hito-debrid-premiumize"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
test-support = ["hito-remote-audio/test-support", "dep:hito-testkit", "dep:tokio-rustls"]

[dependencies]
hito-remote-audio = { path = "../../remote-audio" }
hito-testkit = { path = "../../testkit", optional = true }
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio-rustls = { version = "=0.26.6", default-features = false, optional = true }
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
zeroize.workspace = true

[dev-dependencies]
hito-audio = { path = "../../audio" }
hito-testkit = { path = "../../testkit" }
tokio-rustls = { version = "=0.26.6", default-features = false }
tracing-subscriber.workspace = true

[[test]]
name = "observation"
required-features = ["test-support"]

[[test]]
name = "audio"
required-features = ["test-support"]
