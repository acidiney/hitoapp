services:
  plugin-torbox:
    extends:
      file: deploy/compose/plugin-base.yaml
      service: private-service
    profiles: [plugins]
    image: hito-plugin-torbox:${HITO_TORBOX_IMAGE_TAG:-development}
    build:
      context: ${HITO_TORBOX_BUILD_CONTEXT:-.}
      dockerfile: docker/plugin.Dockerfile
      args:
        PLUGIN: hito-plugin-torbox
        PORT: "8100"
        HITO_PLUGIN_CACHE_ID: hito-plugin-${COMPOSE_PROJECT_NAME:-standalone}
        STATE_DIR: /var/lib/hito-torbox
        SOURCE_ID: ${HITO_TORBOX_SOURCE_ID:?Set the frozen source revision}
        INPUT_SHA256: ${HITO_TORBOX_INPUT_SHA256:?Set the frozen input digest}
    command:
      - --listen
      - 0.0.0.0:8100
      - --provider-token-file
      - /run/secrets/torbox-provider-token
      - --service-token-file
      - /run/secrets/torbox-service-token
      - --catalog-file
      - /run/secrets/torbox-catalog.json
      - --state-key-file
      - /run/secrets/torbox-state-key
      - --state-directory
      - /var/lib/hito-torbox/journal
      - --state-mode
      - ${HITO_TORBOX_STATE_MODE:?Set create-new or open-existing explicitly}
    ports:
      - "127.0.0.1:${HITO_TORBOX_PORT:-8100}:8100"
    environment:
      RUST_LOG: ${HITO_TORBOX_LOG_LEVEL:-info}
    volumes:
      - type: volume
        source: torbox-credentials
        target: /run/secrets
        read_only: true
        volume:
          nocopy: true
      - type: volume
        source: torbox-state
        target: /var/lib/hito-torbox
        read_only: false
        volume:
          nocopy: true
volumes:
  torbox-credentials:
    external: true
    name: ${HITO_TORBOX_CREDENTIAL_VOLUME:?Set a provisioned private credential volume}
  torbox-state:
    external: true
    name: ${HITO_TORBOX_STATE_VOLUME:?Set a separate provisioned private state volume}
