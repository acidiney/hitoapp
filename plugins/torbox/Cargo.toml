[package]
name = "hito-plugin-torbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
test-support = ["hito-debrid-torbox/test-support"]

[dependencies]
axum.workspace = true
cap-fs-ext.workspace = true
cap-std.workspace = true
futures-util.workspace = true
hmac = "=0.12.1"
hito-debrid-torbox = { path = "../../crates/debrid/torbox" }
hito-plugin-sdk = { path = "../../crates/plugin-sdk" }
hyper.workspace = true
hyper-util.workspace = true
libc = "=0.2.190"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
subtle = "=2.6.1"
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
zeroize.workspace = true

[dev-dependencies]
hito-plugin-torbox = { path = ".", features = ["test-support"] }
hito-audio = { path = "../../crates/audio" }
hito-testkit = { path = "../../crates/testkit" }
reqwest.workspace = true
rustls.workspace = true
tempfile.workspace = true
tokio.workspace = true
tokio-rustls = { version = "=0.26.6", default-features = false }
url.workspace = true

[[test]]
name = "contract"
required-features = ["test-support"]

[[bin]]
name = "hito-plugin-torbox"
path = "src/main.rs"
test = false
bench = false
