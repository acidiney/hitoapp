services:
  plugin-folder:
    build:
      context: .
      dockerfile: docker/plugin.Dockerfile
      args:
        PLUGIN: hito-plugin-folder
        PORT: "8090"
        HITO_PLUGIN_CACHE_ID: hito-plugin-${COMPOSE_PROJECT_NAME:-standalone}
        EXTRAS: folder
    command:
      - --music
      - /demo
      - --state
      - /state
      - --listen
      - 0.0.0.0:8090
    ports:
      - "127.0.0.1:8091:8090"
    volumes:
      - plugin-folder-state:/state
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
volumes:
  plugin-folder-state:
