name: Verify
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: "4"
jobs:
  desktop-linux:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/compiler-cache
      - name: Verify Linux desktop in Docker
        run: ./scripts/check-desktop.sh
      - name: Make desktop evidence readable
        if: failure()
        run: sudo chmod -R a+rX test-results/desktop || true
      - name: Upload desktop evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-evidence
          path: test-results/desktop/
          retention-days: 7
  rust-style:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/compiler-cache
      - name: Check formatting
        run: make fmt-check
      - name: Lint
        run: make lint
  rust-core:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/compiler-cache
      - name: Test core
        run: make check-core
  rust-server:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/compiler-cache
      - name: Test server
        run: make check-server
  rust-rest:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/compiler-cache
      - name: Test the other crates
        run: make check-rest
  web:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/compiler-cache
      - name: Install
        run: make web-install
      - name: Lint
        run: make web-lint
      - name: Test
        run: make test-web
      - name: Build
        run: make web-build
      - name: Audit
        run: make web-audit
      - name: Check contracts
        run: make contracts
      - name: Check setup
        run: make setup-check
  e2e:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/compiler-cache
      - name: Install
        run: make web-install
      - name: Browser tests
        run: make e2e
      - name: Upload browser evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: |
            apps/web/test-results/
            test-results/
          retention-days: 7
