[package]
name = "hito-audio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
device = ["dep:cpal", "dep:rtrb", "dep:soundtouch-ffi", "dep:cc"]
native-probe = ["device"]
test-support = ["dep:tempfile"]

[dependencies]
symphonia = { version = "=0.6.1", features = ["all"] }
thiserror.workspace = true
tracing.workspace = true
cpal = { version = "=0.18.2", optional = true }
rtrb = { version = "0.4", optional = true }
soundtouch-ffi = { version = "=0.4.1", features = ["bundled"], optional = true }
tempfile = { workspace = true, optional = true }

[build-dependencies]
cc = { version = "=1.8.0", optional = true }

[dev-dependencies]
hito-audio = { path = ".", features = ["test-support"] }
tempfile.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(loom)'.dependencies]
loom = "=0.7.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }
