[package]
name = "hito-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
test-support = ["dep:axum", "dep:hito-testkit", "dep:tokio-util", "dep:tracing-subscriber"]

[dependencies]
axum = { workspace = true, optional = true }
hito-testkit = { path = "../testkit", optional = true }
tokio-util = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
uuid.workspace = true
thiserror.workspace = true
sha2.workspace = true
base64.workspace = true
argon2.workspace = true
rand.workspace = true
lofty.workspace = true
image.workspace = true
png = "0.18.1"
zune-core = { version = "=0.5.3", features = ["std"] }
zune-jpeg = { version = "=0.5.15", default-features = false, features = ["std"] }
cap-std.workspace = true
cap-fs-ext.workspace = true
notify = { version = "8.2", default-features = false, features = ["macos_fsevent"] }
tracing.workspace = true
utoipa.workspace = true
tempfile.workspace = true
url.workspace = true
reqwest.workspace = true
rustls.workspace = true
chacha20poly1305.workspace = true
zeroize.workspace = true
bytes.workspace = true
futures-util.workspace = true
hito-plugin-sdk = { path = "../plugin-sdk", features = ["schema"] }
hito-metadata-musicbrainz = { path = "../metadata-musicbrainz" }
quick-xml = { version = "=0.42.0", default-features = false }
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }

[dev-dependencies]
hito-core = { path = ".", features = ["test-support"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

