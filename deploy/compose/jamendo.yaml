services:
  plugin-jamendo:
    extends:
      file: deploy/compose/plugin-base.yaml
      service: private-service
    profiles: [plugins]
    image: hito-plugin-jamendo:${HITO_JAMENDO_IMAGE_TAG:-development}
    build:
      context: .
      dockerfile: docker/plugin.Dockerfile
      args:
        PLUGIN: hito-plugin-jamendo
        PORT: "8093"
        HITO_PLUGIN_CACHE_ID: hito-plugin-${COMPOSE_PROJECT_NAME:-standalone}
    command:
      - --client-id-file
      - /run/secrets/jamendo-client-id
      - --listen
      - 0.0.0.0:8093
    ports:
      - "127.0.0.1:${HITO_JAMENDO_PORT:-8094}:8093"
    environment:
      RUST_LOG: ${HITO_JAMENDO_LOG_LEVEL:-info}
    volumes:
      - type: volume
        source: jamendo-credentials
        target: /run/secrets
        read_only: true
        volume:
          nocopy: true
volumes:
  jamendo-credentials:
    external: true
    name: ${HITO_JAMENDO_CREDENTIAL_VOLUME:?Set HITO_JAMENDO_CREDENTIAL_VOLUME to a provisioned private volume}
