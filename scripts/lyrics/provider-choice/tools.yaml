x-node: &node
  profiles: [tools]
  image: node:22-bookworm-slim@sha256:c3de60bf2f9dd0ac6370e6117950ff62d6e339527e7472301c9c78a017978392
  working_dir: /workspace/apps/web
  network_mode: none
  read_only: true
  volumes:
    - ../../..:/workspace
    - modules:/workspace/apps/web/node_modules:ro
  tmpfs:
    - /tmp:size=64m,nosuid,nodev
  security_opt: [no-new-privileges:true]
  pids_limit: 128
  mem_limit: 512m
  init: true
services:
  node:
    <<: *node
  types:
    <<: *node
    mem_limit: 1536m
    environment:
      NODE_OPTIONS: --max-old-space-size=1024
volumes:
  modules:
    external: true
    name: hito_node-modules
