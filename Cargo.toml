[workspace]
members = ["crates/core", "apps/server", "crates/plugin-sdk", "apps/desktop", "crates/audio", "crates/playback", "plugins/folder", "plugins/spotify", "plugins/youtube", "plugins/jamendo", "plugins/listenbrainz", "apps/community", "crates/metadata-musicbrainz", "crates/debrid/real-debrid", "plugins/real-debrid", "crates/debrid/all-debrid", "crates/remote-audio", "plugins/all-debrid", "crates/debrid/torbox", "crates/debrid/premiumize", "plugins/torbox", "plugins/premiumize", "crates/testkit"]
exclude = ["vendor/sqlx-sqlite"]
resolver = "3"

[patch.crates-io]
sqlx-sqlite = { path = "vendor/sqlx-sqlite" }

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.90"
license = "AGPL-3.0-only"

[workspace.dependencies]
axum = { version = "0.8.6", features = ["macros"] }
tokio = { version = "1.47", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
sha2 = "0.10"
base64 = "0.22"
argon2 = "0.5"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tower-http = { version = "0.6", features = ["fs", "trace", "limit", "set-header"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
tempfile = "3"
lofty = { version = "0.22.4", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
cap-std = "4.0.3"
cap-fs-ext = "4.0.3"
url = { version = "2", features = ["serde"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider", "json"] }
chacha20poly1305 = "0.10.1"
zeroize = "1"
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

utoipa = { version = "6", features = ["axum_extras", "uuid"] }
utoipa-axum = "0.3"

[profile.release]
lto = "thin"
strip = true

[profile.test.package.libsqlite3-sys]
opt-level = 2

[profile.test.package.hito-audio]
opt-level = 2
