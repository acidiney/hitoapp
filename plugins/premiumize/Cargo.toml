[package]
name = "hito-plugin-premiumize"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
test-support = ["hito-debrid-premiumize/test-support"]

[dependencies]
axum.workspace = true
base64.workspace = true
futures-util.workspace = true
hmac = "=0.12.1"
hito-debrid-premiumize = { path = "../../crates/debrid/premiumize" }
hito-plugin-sdk = { path = "../../crates/plugin-sdk" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle = "=2.6.1"
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
hito-audio = { path = "../../crates/audio" }
hito-testkit = { path = "../../crates/testkit" }
reqwest.workspace = true
rustls.workspace = true
tempfile.workspace = true
tokio-rustls = { version = "=0.26.6", default-features = false }
url.workspace = true

[[test]]
name = "contract"
required-features = ["test-support"]

[[bin]]
name = "hito-plugin-premiumize"
path = "src/main.rs"
test = false
bench = false
